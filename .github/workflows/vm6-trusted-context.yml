name: VM6 trusted-context canary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prove-trusted-context:
    runs-on: ubuntu-latest
    steps:
      - name: Prove controlled repository-secret access
        shell: bash
        env:
          VM6_IMPACT_SECRET: ${{ secrets.VM6_IMPACT_SECRET }}
        run: |
          test -n "$VM6_IMPACT_SECRET"
          digest="$(printf '%s' "$VM6_IMPACT_SECRET" | sha256sum | cut -d' ' -f1)"
          echo "VM6_IMPACT_SECRET_SHA256=$digest"

      - name: Prove upstream write-scoped token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          test "$REPO" = "livastic-vm6-primary-20260911/untrusted-config-pr-vm6"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d "{\"ref\":\"refs/heads/vm6-actions-impact-canary-20260912\",\"sha\":\"$SHA\"}"
